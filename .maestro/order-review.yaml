# Preview is available to an unfunded testnet wallet without approving or sending an order.
appId: com.jakrim.tape
---
- runFlow: helpers/launch.yaml
- tapOn: "Account"
- scrollUntilVisible:
    element: "Testnet · trading"
    direction: UP
- tapOn: "Testnet · trading"
- runFlow:
    when:
      visible:
        id: "create-device-wallet"
    commands:
      - tapOn:
          id: "create-device-wallet"
- extendedWaitUntil:
    visible:
      id: "wallet-address"
    timeout: 15000
- tapOn: "Markets"
- extendedWaitUntil:
    visible:
      id: "market-row-ETH"
    timeout: 20000
- tapOn:
    id: "market-row-ETH"
- extendedWaitUntil:
    visible:
      id: "order-book"
    timeout: 15000
- tapOn:
    id: "long-button"
- tapOn:
    id: "amount-input"
- inputText: "250"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Done editing"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Review order"
    direction: DOWN
- tapOn: "Review order"
- extendedWaitUntil:
    visible: "Review testnet order"
    timeout: 30000
- assertVisible: "Price cap.*"
- takeScreenshot: order-review-testnet
- scrollUntilVisible:
    element: "Edit order"
    direction: DOWN
- tapOn: "Edit order"
- assertVisible:
    id: "amount-input"
