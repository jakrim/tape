# Regression: the first row rendered blank after re-sorting (Gainers, then Volume) or after
# pull-to-refresh. Cause: stale layout indices in FlashList 2.0.2, fixed by upgrading to 2.3.
appId: com.jakrim.tape
---
- runFlow: helpers/launch.yaml
- extendedWaitUntil:
    visible:
      id: "market-row-BTC"
    timeout: 20000
- tapOn: "Gainers"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Volume"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "market-row-BTC"
- swipe:
    start: "50%,45%"
    end: "50%,80%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "market-row-BTC"
