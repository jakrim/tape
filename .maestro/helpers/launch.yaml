# Dev builds load JS from the local Metro server; release builds (CI) just launch.
appId: com.jakrim.tape
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${DEV_CLIENT == 'true'}
    commands:
      - openLink: com.jakrim.tape://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&disableOnboarding=1
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
- extendedWaitUntil:
    visible: "Markets"
    timeout: 60000
